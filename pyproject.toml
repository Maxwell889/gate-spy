[project]
name = "gate-spy"
version = "0.1.0"
description = "An LLM-agent-based framework for reasoning over gate-level netlists"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27.2",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
