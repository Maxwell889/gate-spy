[project]
name = "gate-spy"
version = "0.1.0"
description = "An LLM-agent-based framework for reasoning over gate-level netlists"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27.2",
    "langfuse>=4.8.1",
    "pysr>=1.5.10",
    "sympy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
markers = [
    "sr: tests that may run the PySR backend",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
